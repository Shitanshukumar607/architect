services:
  postgres:
    image: postgres:16
    container_name: architect-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: architect

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: architect-backend

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    restart: always

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data: